name: Sync GitHub issues to Notion

on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled]

permissions:
  contents: read
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync issue to Notion
        uses: actions/github-script@v8
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: 3c713063-4721-80db-9929-000bd164ae1b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const token = process.env.NOTION_TOKEN;
            const dataSourceId = process.env.NOTION_DATA_SOURCE_ID;
            if (!token) {
              core.setFailed('NOTION_TOKEN is not configured for this repository.');
              return;
            }

            const supportedActions = new Set([
              'opened', 'edited', 'closed', 'reopened',
              'assigned', 'unassigned', 'labeled', 'unlabeled'
            ]);
            const action = context.payload.action;
            const issue = context.payload.issue;
            if (!issue || !supportedActions.has(action)) return;

            const notionRequest = async (path, options = {}) => {
              const response = await fetch(`https://api.notion.com/v1${path}`, {
                ...options,
                headers: {
                  Authorization: `Bearer ${token}`,
                  'Notion-Version': '2026-03-11',
                  'Content-Type': 'application/json',
                  ...(options.headers || {})
                }
              });
              const text = await response.text();
              let data;
              try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
              if (!response.ok) {
                throw new Error(`Notion API ${response.status}: ${JSON.stringify(data)}`);
              }
              return data;
            };

            const chunkRichText = (value) => {
              if (!value) return [];
              const chunks = [];
              for (let i = 0; i < value.length; i += 1900) {
                chunks.push({ type: 'text', text: { content: value.slice(i, i + 1900) } });
              }
              return chunks;
            };

            const normalizePageId = (value) => {
              const raw = value.split('/').pop().replace(/-/g, '');
              if (raw.length !== 32) return value.split('/').pop();
              return `${raw.slice(0, 8)}-${raw.slice(8, 12)}-${raw.slice(12, 16)}-${raw.slice(16, 20)}-${raw.slice(20)}`;
            };

            const notionUrl = (issue.body || '').match(/https:\/\/app\.notion\.com\/p\/[A-Za-z0-9-]+/i)?.[0] || null;
            const cleanBody = (issue.body || '')
              .split('\n')
              .filter((line) => !/^(Mirrors the Notion task:|[-*] Status:|[-*] Type:|[-*] Notion project:|This issue is the GitHub counterpart|This issue covers documentation)/i.test(line.trim()))
              .join('\n')
              .replace(/\n{3,}/g, '\n\n')
              .trim();
            const status = issue.state === 'closed' ? 'Done' : 'Not started';
            const repository = context.payload.repository?.full_name || `${context.repo.owner}/${context.repo.repo}`;
            const externalDescription = `GitHub issue: ${issue.html_url}\nRepository: ${repository}\n\n${cleanBody}`.trim();

            const pageProperties = (description) => ({
              'Task name': {
                title: [{ type: 'text', text: { content: issue.title } }]
              },
              Description: {
                rich_text: chunkRichText(description)
              },
              Status: {
                status: { name: status }
              }
            });

            const updatePage = async (pageId, description) => {
              await notionRequest(`/pages/${normalizePageId(pageId)}`, {
                method: 'PATCH',
                body: JSON.stringify({ properties: pageProperties(description) })
              });
            };

            let pageId = notionUrl ? normalizePageId(notionUrl) : null;
            let keepExternalMarker = false;

            if (!pageId) {
              const matches = await notionRequest(`/data_sources/${dataSourceId}/query`, {
                method: 'POST',
                body: JSON.stringify({
                  filter: {
                    property: 'Description',
                    rich_text: { contains: issue.html_url }
                  },
                  page_size: 10
                })
              });
              const match = (matches.results || []).find((result) => result.object === 'page');
              pageId = match?.id || null;
              keepExternalMarker = Boolean(pageId);
            }

            if (pageId) {
              await updatePage(pageId, keepExternalMarker ? externalDescription : cleanBody);
              core.info(`Updated Notion task for ${repository}#${issue.number}`);
            } else if (action === 'opened') {
              await notionRequest('/pages', {
                method: 'POST',
                body: JSON.stringify({
                  parent: { data_source_id: dataSourceId },
                  properties: pageProperties(externalDescription)
                })
              });
              core.info(`Created Notion task for ${repository}#${issue.number}`);
            }