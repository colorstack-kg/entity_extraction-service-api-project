name: Sync GitHub issue descriptions to Notion

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: read

jobs:
  sync-description:
    name: Sync issue description
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Sync description to matching task
        uses: actions/github-script@v8
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: 3c713063-4721-80db-9929-000bd164ae1b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const action = context.payload.action;
            const token = process.env.NOTION_TOKEN;
            const dataSourceId = process.env.NOTION_DATA_SOURCE_ID;

            if (!issue) {
              core.setFailed('The issues event did not include an issue payload.');
              return;
            }
            if (action === 'edited' && !Object.prototype.hasOwnProperty.call(context.payload.changes ?? {}, 'body')) {
              core.info('Issue description did not change; no Notion update is needed.');
              return;
            }
            if (!token) {
              core.setFailed('NOTION_TOKEN is not configured for this repository.');
              return;
            }

            const richText = (value) => {
              const parts = [];
              let part = '';
              for (const character of String(value ?? '')) {
                if (part.length + character.length > 1900) {
                  parts.push({ type: 'text', text: { content: part } });
                  part = '';
                }
                part += character;
              }
              if (part) parts.push({ type: 'text', text: { content: part } });
              return parts;
            };

            const notionRequest = async (path, options = {}) => {
              const apiBase = 'https:' + '//' + 'api.notion.com/v1';
              const response = await fetch(apiBase + path, {
                ...options,
                headers: {
                  Authorization: `Bearer ${token}`,
                  'Notion-Version': '2026-03-11',
                  'Content-Type': 'application/json',
                  ...(options.headers || {})
                }
              });
              const text = await response.text();
              let data = {};
              try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
              if (!response.ok) throw new Error(`Notion API ${response.status}: ${JSON.stringify(data)}`);
              return data;
            };

            const matches = await notionRequest(`/data_sources/${dataSourceId}/query`, {
              method: 'POST',
              body: JSON.stringify({
                filter: { property: 'GitHub issue', url: { equals: issue.html_url } },
                page_size: 10
              })
            });
            const task = (matches.results ?? []).find((result) => result.object === 'page');
            const description = issue.body ?? '';

            if (!task) {
              if (action !== 'opened') {
                core.setFailed(`No task is linked to ${issue.html_url}.`);
                return;
              }
              await notionRequest('/pages', {
                method: 'POST',
                body: JSON.stringify({
                  parent: { data_source_id: dataSourceId },
                  properties: {
                    'Task name': { title: richText(issue.title) },
                    'GitHub issue': { url: issue.html_url },
                    Description: { rich_text: richText(description) },
                    Status: { status: { name: issue.state === 'closed' ? 'Done' : 'Not started' } }
                  }
                })
              });
              core.info(`Created a task for issue #${issue.number}.`);
              return;
            }

            await notionRequest(`/pages/${task.id}`, {
              method: 'PATCH',
              body: JSON.stringify({
                properties: { Description: { rich_text: richText(description) } }
              })
            });
            core.info(`Updated the Description property for issue #${issue.number}.`);
