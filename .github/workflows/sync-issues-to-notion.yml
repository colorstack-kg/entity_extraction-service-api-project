name: Sync GitHub issue pages to Notion

on:
  issues:
    types: [edited]

permissions:
  contents: read
  issues: read

jobs:
  sync-page-content:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Sync issue body to the matching task page
        uses: actions/github-script@v8
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: 3c713063-4721-80db-9929-000bd164ae1b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const changed = context.payload.changes ?? {};
            const token = process.env.NOTION_TOKEN;
            const dataSourceId = process.env.NOTION_DATA_SOURCE_ID;
            if (!issue || !Object.prototype.hasOwnProperty.call(changed, 'body')) return core.info('Issue body did not change.');
            if (!token) return core.setFailed('NOTION_TOKEN is not configured for this repository.');

            const richText = (value) => {
              const result = []; let part = '';
              for (const character of String(value ?? '')) {
                if (part.length + character.length > 1900) { result.push({ type: 'text', text: { content: part } }); part = ''; }
                part += character;
              }
              if (part) result.push({ type: 'text', text: { content: part } });
              return result;
            };
            const markdownBlocks = (markdown) => {
              const lines = String(markdown ?? '').replace(/\r\n/g, '\n').split('\n');
              const blocks = [];
              for (let i = 0; i < lines.length;) {
                const line = lines[i];
                if (!line.trim()) { i += 1; continue; }
                const heading = line.match(/^(#{1,3})\s+(.+)$/);
                const todo = line.match(/^[-*]\s+\[([ xX])\]\s*(.*)$/);
                const bullet = line.match(/^[-*+]\s+(.+)$/);
                const numbered = line.match(/^\d+[.)]\s+(.+)$/);
                if (heading) { const type = `heading_${heading[1].length}`; blocks.push({ object: 'block', type, [type]: { rich_text: richText(heading[2]) } }); i += 1; continue; }
                if (todo) { blocks.push({ object: 'block', type: 'to_do', to_do: { rich_text: richText(todo[2]), checked: /x/i.test(todo[1]) } }); i += 1; continue; }
                if (bullet) { blocks.push({ object: 'block', type: 'bulleted_list_item', bulleted_list_item: { rich_text: richText(bullet[1]) } }); i += 1; continue; }
                if (numbered) { blocks.push({ object: 'block', type: 'numbered_list_item', numbered_list_item: { rich_text: richText(numbered[1]) } }); i += 1; continue; }
                const paragraph = [line]; i += 1;
                while (i < lines.length && lines[i].trim() && !/^(#{1,3})\s+|^[-*+]\s+|^\d+[.)]\s+/.test(lines[i])) paragraph.push(lines[i++]);
                blocks.push({ object: 'block', type: 'paragraph', paragraph: { rich_text: richText(paragraph.join('\n')) } });
              }
              return blocks;
            };
            const request = async (path, options = {}) => {
              const response = await fetch(('https:' + '//' + 'api.notion.com/v1') + path, { ...options, headers: { Authorization: `Bearer ${token}`, 'Notion-Version': '2026-03-11', 'Content-Type': 'application/json', ...(options.headers ?? {}) } });
              const text = await response.text(); let data = {};
              try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
              if (!response.ok) throw new Error(`Notion API ${response.status}: ${JSON.stringify(data)}`);
              return data;
            };
            const matches = await request(`/data_sources/${dataSourceId}/query`, { method: 'POST', body: JSON.stringify({ filter: { property: 'GitHub issue', url: { equals: issue.html_url } }, page_size: 10 }) });
            const task = (matches.results ?? []).find((result) => result.object === 'page');
            if (!task) return core.setFailed(`No task is linked to ${issue.html_url}.`);

            const children = []; let cursor = null;
            do {
              const page = await request(`/blocks/${task.id}/children?page_size=100${cursor ? `&start_cursor=${encodeURIComponent(cursor)}` : ''}`);
              children.push(...(page.results ?? [])); cursor = page.has_more ? page.next_cursor : null;
            } while (cursor);
            const plainText = (block) => (block[block.type]?.rich_text ?? []).map((item) => item.plain_text ?? item.text?.content ?? '').join('').trim().toLowerCase();
            const supportingIndex = children.findIndex((block) => /^heading_/.test(block.type) && plainText(block) === 'supporting files');
            const replaceable = supportingIndex >= 0 ? children.slice(0, supportingIndex) : children;
            for (const block of replaceable) await request(`/blocks/${block.id}`, { method: 'DELETE' });

            const blocks = markdownBlocks(issue.body); let position = { type: 'start' };
            for (let i = 0; i < blocks.length; i += 100) {
              const appended = await request(`/blocks/${task.id}/children`, { method: 'PATCH', body: JSON.stringify({ children: blocks.slice(i, i + 100), position }) });
              const last = appended.results?.at(-1)?.id;
              position = last ? { type: 'after_block', after_block: { id: last } } : { type: 'end' };
            }
            core.info(`Updated the Notion page content for issue #${issue.number}.`);
